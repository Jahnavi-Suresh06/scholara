{% extends "base.html" %}

{% block title %}
Edit Profile | Scholara
{% endblock %}


{% block content %}

<div class="profile-page">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <div>
            <h1>Edit Profile</h1>
            <p>Update your account information and preferences.</p>
        </div>
    </div>


    <!-- EDIT PROFILE CARD -->
    <div class="edit-profile-card">

        <div class="card-header">
            <div class="header-icon">
                <i class="bi bi-pencil-square"></i>
            </div>

            <div>
                <h2>Profile Information</h2>
                <p>
                    Keep your account details up to date.
                </p>
            </div>
        </div>


        <!-- EDIT FORM -->
        <form method="POST" action="{{ url_for('auth.edit_profile') }}" class="edit-profile-form">

            <!-- USERNAME -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text" id="username" name="username" value="{{ user.username }}" required
                    autocomplete="username">

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" value="{{ user.email }}" required autocomplete="email">

            </div>


            <!-- RESEARCH INTEREST -->
            <div class="form-group">

                <label for="domain_interest">
                    Research Interest
                </label>

                <input type="text" id="domain_interest" name="domain_interest" value="{{ user.domain_interest or '' }}"
                    placeholder="Example: Artificial Intelligence">

                <small>
                    Tell us about your preferred research domain.
                </small>

            </div>


            <!-- ACTION BUTTONS -->
            <div class="form-actions">

                <a href="{{ url_for('auth.profile') }}" class="btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn-save">
                    <i class="bi bi-check-circle"></i>
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<style>
    /* ==========================================
   EDIT PROFILE PAGE
========================================== */

    .profile-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 24px 60px;
    }


    /* ==========================================
   PAGE HEADER
========================================== */

    .page-header {
        margin-bottom: 28px;
    }

    .page-header h1 {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 700;
        color: #1f2937;
    }

    .page-header p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
    }


    /* ==========================================
   EDIT CARD
========================================== */

    .edit-profile-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }


    /* ==========================================
   CARD HEADER
========================================== */

    .card-header {
        display: flex;
        align-items: center;
        gap: 16px;

        padding-bottom: 24px;
        margin-bottom: 28px;

        border-bottom: 1px solid #e5e7eb;
    }

    .header-icon {
        width: 48px;
        height: 48px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: #eef2ff;
        color: #4f46e5;

        font-size: 21px;
    }

    .card-header h2 {
        margin: 0 0 5px;

        font-size: 19px;
        font-weight: 650;

        color: #1f2937;
    }

    .card-header p {
        margin: 0;

        color: #64748b;
        font-size: 14px;
    }


    /* ==========================================
   FORM
========================================== */

    .edit-profile-form {
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        margin-bottom: 8px;

        font-size: 14px;
        font-weight: 600;

        color: #374151;
    }

    .form-group input {

        width: 100%;

        padding: 12px 14px;

        border: 1px solid #d1d5db;
        border-radius: 10px;

        font-size: 15px;

        color: #1f2937;
        background: #ffffff;

        outline: none;

        box-sizing: border-box;

        transition: border-color 0.2s,
            box-shadow 0.2s;
    }

    .form-group input:focus {

        border-color: #6366f1;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .form-group small {

        margin-top: 7px;

        color: #94a3b8;

        font-size: 13px;
    }


    /* ==========================================
   BUTTONS
========================================== */

    .form-actions {

        display: flex;

        justify-content: flex-end;

        gap: 12px;

        margin-top: 8px;

        padding-top: 22px;

        border-top:
            1px solid #e5e7eb;
    }


    .btn-save,
    .btn-cancel {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        padding: 11px 18px;

        border-radius: 9px;

        font-size: 14px;

        font-weight: 600;

        text-decoration: none;

        cursor: pointer;

        transition:
            all 0.2s ease;
    }


    /* SAVE BUTTON */

    .btn-save {

        border: none;

        background: #4f46e5;

        color: #ffffff;
    }

    .btn-save:hover {

        background: #4338ca;

        transform:
            translateY(-1px);
    }


    /* CANCEL BUTTON */

    .btn-cancel {

        background: #ffffff;

        border:
            1px solid #d1d5db;

        color: #475569;
    }

    .btn-cancel:hover {

        background: #f8fafc;

        border-color: #94a3b8;
    }


    /* ==========================================
   RESPONSIVE
========================================== */

    @media (max-width: 600px) {

        .profile-page {

            padding:
                28px 16px 40px;
        }

        .edit-profile-card {

            padding:
                22px 18px;
        }

        .form-actions {

            flex-direction: column-reverse;
        }

        .btn-save,
        .btn-cancel {

            width: 100%;
        }

    }
</style>

{% endblock %}
