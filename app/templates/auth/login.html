{% extends "base.html" %}
{% block title %}Login | Scholara{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-modern">
            <div class="card-body p-4">
                <h4 class="card-title mb-1"><i class="bi bi-box-arrow-in-right"></i> Login</h4>
                <p class="text-muted small mb-4">Welcome back -- sign in to continue.</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" class="form-control" name="identifier" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="mt-3 mb-0 text-center small">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
