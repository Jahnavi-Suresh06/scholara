{% extends "base.html" %}

{% block title %}
Change Password | Scholara
{% endblock %}


{% block content %}

<div class="change-password-page">

    <div class="change-password-container">

        <!-- Back Button -->

        <a href="{{ url_for('auth.profile') }}" class="back-to-profile">

            <i class="bi bi-arrow-left"></i>

            Back to Profile

        </a>


        <!-- Password Card -->

        <div class="card card-modern password-card">

            <div class="card-body">

                <!-- Header -->

                <div class="password-header">

                    <div class="password-icon">

                        <i class="bi bi-shield-lock"></i>

                    </div>

                    <div>

                        <h3>
                            Change Password
                        </h3>

                        <p>
                            Update your password to keep your account secure.
                        </p>

                    </div>

                </div>


                <hr>


                <!-- Password Form -->

                <form method="POST" action="{{ url_for('auth.update_password') }}">


                    <!-- Current Password -->

                    <div class="mb-4">

                        <label for="current_password" class="form-label">

                            Current Password

                        </label>

                        <div class="password-input-wrapper">

                            <input type="password" class="form-control" id="current_password" name="current_password"
                                placeholder="Enter your current password" required>

                        </div>

                    </div>


                    <!-- New Password -->

                    <div class="mb-2">

                        <label for="new_password" class="form-label">

                            New Password

                        </label>

                        <input type="password" class="form-control" id="new_password" name="new_password"
                            placeholder="Enter your new password" minlength="8" required>

                    </div>


                    <p class="password-hint">

                        Password must be at least 8 characters long.

                    </p>


                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label for="confirm_password" class="form-label">

                            Confirm New Password

                        </label>

                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            placeholder="Confirm your new password" minlength="8" required>

                    </div>


                    <!-- Buttons -->

                    <div class="password-actions">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-check-circle"></i>

                            Update Password

                        </button>


                        <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary">

                            Cancel

                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
