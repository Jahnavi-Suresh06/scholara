# render.yaml
# Deployment config for Render (used in Phase 10).
# Not needed for local development -- included now so the project is
# deploy-ready from the start.

services:
    type: web
    name: research-paper-recommender
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: research-paper-recommender-db
          property: connectionString

databases:
  - name: research-paper-recommender-db
    plan: free
